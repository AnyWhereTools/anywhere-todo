<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><title>待办 Todo</title></head><body>
<header><div><h1>待办 Todo</h1><p>记录下一步，让系统在约定时间提醒。</p></div><button id="new" class="primary">＋ 新建待办</button></header>
<div class="toolbar"><select id="filter" aria-label="待办视图"><option value="all">全部未完成</option><option value="today">今天</option><option value="upcoming">即将到期</option><option value="overdue">已逾期</option><option value="done">已完成</option></select><input id="search" type="search" placeholder="搜索标题和备注" aria-label="搜索待办"><button id="retry">检查提醒状态</button></div>
<p id="message" role="status" aria-live="polite"></p><p id="notification-status" class="muted" role="status"></p>
<form id="form" hidden><h2 id="form-title">新建待办</h2><label>标题<input id="title" required maxlength="200" placeholder="例如：提交项目报告"></label><label>备注<textarea id="note" rows="3" placeholder="补充信息"></textarea></label><div class="toolbar"><label>优先级<select id="priority"><option value="0">普通</option><option value="1">重要</option><option value="2">紧急</option></select></label><label>提醒时间<input id="due" type="datetime-local"></label><label>重复<select id="recurrence"><option value="none">不重复</option><option value="daily">每天</option><option value="weekly">每周</option></select></label></div><p class="muted">留空则不提醒。每天按所选时刻、每周按所选星期和时刻循环；首次为下一次匹配时间。完成重复待办会停止后续提醒。</p><div class="actions"><button type="submit" class="primary">保存</button><button id="cancel" type="button">取消</button></div></form>
<div id="list" aria-label="待办列表"></div><script src="logic.js"></script><script src="app.js"></script></body></html>
